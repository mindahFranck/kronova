<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site bloqué — Kronova</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #0f172a; --muted: #64748b; --card: #fff; --line: #e5e5e5; --accent: #e11d48; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --fg: #f8fafc; --muted: #94a3b8; --card: #111827; --line: #1e293b; --accent: #fb7185; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; text-align: center; }
      .badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { margin: 0 0 16px; color: var(--muted); }
      .time { font: 600 44px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; margin: 18px 0; }
      button, a.btn { display: inline-block; width: 100%; padding: 11px 16px; border-radius: 12px; border: 0; background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; margin-top: 6px; }
      a.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Bouclier Kronova</div>
      <h1 id="title">Site bloqué pendant la concentration</h1>
      <p id="domain"></p>
      <div class="time" id="remaining">--:--</div>
      <p id="hint">Reviens à ta tâche : ce site se débloque à la fin de la session.</p>
      <button type="button" id="back">Retour à Kronova</button>
      <a class="btn secondary" id="continue" hidden>Continuer vers le site</a>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
