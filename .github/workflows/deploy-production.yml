name: Deploy Kronova

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/kronova
  # Domaine de production — modifier ici pour changer de cible.
  APP_DOMAIN: kro-nova.com
  WWW_DOMAIN: www.kro-nova.com

jobs:

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying Kronova..."

            docker network create proxy-tier 2>/dev/null || echo "Network proxy-tier already exists"

            # Même infrastructure TLS que Meet 237 : nginx-proxy termine le HTTPS.
            # Sans lui le conteneur serait sain mais le site injoignable — on échoue ici.
            if ! docker ps --format '{{.Names}}' | grep -qx nginx-proxy; then
              echo "❌ nginx-proxy n'est pas démarré — le site serait injoignable."
              exit 1
            fi

            # Certificat : posé à la main (Cloudflare Origin CA) ou émis par acme-companion
            # grâce à LETSENCRYPT_HOST. Absent au premier déploiement = avertissement seulement.
            CERTS=$(docker inspect nginx-proxy \
              --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/certs"}}{{.Source}}{{end}}{{end}}')
            if [ -n "$CERTS" ] && command -v openssl >/dev/null 2>&1; then
              crt="$CERTS/${{ env.APP_DOMAIN }}.crt"
              if [ ! -f "$crt" ]; then
                echo "⚠️ Aucun certificat pour ${{ env.APP_DOMAIN }} dans $CERTS (voir DEPLOY.md)"
              elif ! openssl x509 -checkend 0 -noout -in "$crt" >/dev/null 2>&1; then
                echo "❌ Certificat EXPIRÉ pour ${{ env.APP_DOMAIN }} — $(openssl x509 -enddate -noout -in "$crt")"
                exit 1
              elif ! openssl x509 -checkend 2592000 -noout -in "$crt" >/dev/null 2>&1; then
                echo "⚠️ Certificat ${{ env.APP_DOMAIN }} expire sous 30 jours"
              else
                echo "✅ Certificat ${{ env.APP_DOMAIN }} OK"
              fi
            fi

            sudo mkdir -p /var/kronova/data
            sudo chown -R 1000:1000 /var/kronova/data

            docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}
            docker rm -f kronova-app 2>/dev/null || true

            docker run -d \
              --name kronova-app \
              --restart unless-stopped \
              --network proxy-tier \
              --user 1000:1000 \
              -e VIRTUAL_HOST=${{ env.APP_DOMAIN }},${{ env.WWW_DOMAIN }} \
              -e VIRTUAL_PORT=3000 \
              -e LETSENCRYPT_HOST=${{ env.APP_DOMAIN }},${{ env.WWW_DOMAIN }} \
              -e LETSENCRYPT_EMAIL=${{ secrets.ADMIN_EMAIL }} \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e TRUST_PROXY=true \
              -e APP_URL=https://${{ env.APP_DOMAIN }} \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e MONGODB_DB=${{ secrets.MONGODB_DB || 'kronova' }} \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e SIGNUP_CODE="${{ secrets.SIGNUP_CODE }}" \
              -e ALLOWED_EMAIL_DOMAINS="${{ secrets.ALLOWED_EMAIL_DOMAINS }}" \
              -v /var/kronova/data:/app/data \
              ${{ env.APP_IMAGE }}:${{ github.sha }}

            echo "⏳ Waiting for Kronova to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' kronova-app 2>/dev/null || echo starting)
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Kronova healthy"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "❌ Kronova unhealthy after 150s"
                docker logs --tail 50 kronova-app
                exit 1
              fi
              sleep 5
            done

            docker image prune -f >/dev/null

  verify-deployment:
    name: Verify deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Public health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://${{ env.APP_DOMAIN }}/api/health; then
              echo ""
              echo "🎉 https://${{ env.APP_DOMAIN }} est en ligne"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Conteneur sain mais https://${{ env.APP_DOMAIN }} injoignable (DNS / certificat ?)"
          exit 1
