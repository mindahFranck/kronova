name: Deploiement Kronova

# Le deploiement ne part que de la branche principale, ou a la demande.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois : deux executions concurrentes pourraient
# remettre en ligne une image plus ancienne que celle deja deployee.
concurrency:
  group: production-kronova
  cancel-in-progress: false

env:
  # Nom de l'image ecrit ici et non tire d'un secret : ce n'est pas une donnee
  # confidentielle (meme compte Docker Hub qu'Akademika).
  APP_IMAGE: nkemeni/kronova
  WEB_HOST: kro-nova.com

  # Ce serveur heberge aussi MboaPass et Akademika. Tous les noms propres a
  # Kronova portent le prefixe `kronova` pour ne jamais remplacer leurs
  # ressources. Le reseau `proxy-tier` et nginx-proxy sont, eux, communs.
  APP_CONTAINER: kronova-app
  DATA_DIR: /var/kronova/data

jobs:
  # ---------------------------------------------------------------------------
  # Rien ne part sans que la verification soit passee.
  # ---------------------------------------------------------------------------
  verifier:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage
        run: npm run lint
      - name: Construction (site + extension)
        run: npm run build
      - name: Extension empaquetee
        run: unzip -l dist/downloads/kronova-extension.zip | grep -q manifest.json

  # ---------------------------------------------------------------------------
  # Construction de l'image
  # ---------------------------------------------------------------------------
  construire:
    name: Image
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          # `latest` designe ce qui tourne ; l'empreinte du commit donne un point
          # de retour precis.
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Socle : reseau, mandataire, repertoire persistant
  # ---------------------------------------------------------------------------
  socle:
    name: Socle
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - name: Parametres de connexion
        # « Secrets » et « Variables » sont deux onglets distincts : se tromper
        # d'onglet ne produit aucune erreur, la valeur arrive simplement vide et
        # le serveur refuse la connexion. On annonce donc ce qui est renseigne,
        # sans jamais afficher les valeurs.
        env:
          H: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          U: ${{ secrets.SSH_USER || vars.SSH_USER || secrets.SERVER_USER || vars.SERVER_USER }}
          P: ${{ secrets.SSH_PASSWORD }}
          P_VAR: ${{ vars.SSH_PASSWORD }}
        run: |
          echo "SSH_HOST     : $([ -n "$H" ] && echo "renseigne ($H)" || echo ABSENT)"
          echo "SSH_USER     : $([ -n "$U" ] && echo "renseigne ($U)" || echo ABSENT)"
          echo "SSH_PASSWORD : $([ -n "$P" ] && echo "renseigne (${#P} caracteres)" || echo ABSENT)"
          if [ -n "$P_VAR" ]; then
            echo "ATTENTION : SSH_PASSWORD est dans l'onglet Variables (lisible en clair) : deplacez-le dans Secrets."
          fi
          case "$P" in *[[:space:]]) echo "ATTENTION : SSH_PASSWORD se termine par un espace ou un retour a la ligne." ;; esac
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "Parametre SSH manquant (SSH_USER est aussi accepte sous le nom SERVER_USER)"
            exit 1
          fi

      - name: Preparer le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER || secrets.SERVER_USER || vars.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "▸ Reseau partage"
            docker network create proxy-tier 2>/dev/null || true

            echo "▸ Mandataire et certificats"
            docker ps --format '{{.Names}}' | grep -q '^nginx-proxy$' \
              || { echo "nginx-proxy absent : le site serait injoignable"; exit 1; }
            docker ps --format '{{.Names}}' | grep -q 'acme' \
              || echo "  avertissement : le compagnon Let's Encrypt ne tourne pas (pas de HTTPS)"

            echo "▸ Repertoire de donnees"
            # La connexion se fait par mot de passe : un `sudo` qui attend une
            # saisie bloquerait le deploiement jusqu'a expiration.
            if [ "$(id -u)" -eq 0 ]; then
              ELEVER=""
            elif sudo -n true 2>/dev/null; then
              ELEVER="sudo"
            elif [ -d ${{ env.DATA_DIR }} ] && [ -w ${{ env.DATA_DIR }} ]; then
              ELEVER="skip"
            else
              echo "Impossible de creer ${{ env.DATA_DIR }} sans mot de passe. En root, une fois :"
              echo "  mkdir -p ${{ env.DATA_DIR }} && chown -R 1000:1000 /var/kronova"
              exit 1
            fi
            if [ "$ELEVER" != skip ]; then
              $ELEVER mkdir -p ${{ env.DATA_DIR }}
              # 1000 : compte `node` sans privileges de l'image
              $ELEVER chown -R 1000:1000 /var/kronova
              $ELEVER chmod -R 750 /var/kronova
            fi

            echo "✓ Socle pret"

  # ---------------------------------------------------------------------------
  # Mise en service, avec retour arriere en cas d'echec
  # ---------------------------------------------------------------------------
  deployer:
    name: Application
    runs-on: ubuntu-latest
    needs: [construire, socle]
    steps:
      - name: Mettre en service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER || secrets.SERVER_USER || vars.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            NOUVELLE='${{ env.APP_IMAGE }}:${{ github.sha }}'
            PRECEDENTE=$(docker inspect -f '{{.Config.Image}}' ${{ env.APP_CONTAINER }} 2>/dev/null || echo '')
            echo "▸ Version en place : ${PRECEDENTE:-aucune}"

            docker pull "$NOUVELLE"

            # Let's Encrypt emet un seul certificat pour tous les noms demandes :
            # si `www` pointe encore ailleurs, la validation echoue et AUCUN
            # certificat n'est emis. On n'inclut donc `www` que s'il pointe deja
            # vers le meme serveur ; il sera ajoute au deploiement suivant.
            IP_APEX=$(getent ahostsv4 ${{ env.WEB_HOST }} | awk 'NR==1{print $1}')
            IP_WWW=$(getent ahostsv4 www.${{ env.WEB_HOST }} | awk 'NR==1{print $1}')
            if [ -n "$IP_WWW" ] && [ "$IP_WWW" = "$IP_APEX" ]; then
              CERT_HOSTS='${{ env.WEB_HOST }},www.${{ env.WEB_HOST }}'
            else
              CERT_HOSTS='${{ env.WEB_HOST }}'
              echo "  avertissement : www.${{ env.WEB_HOST }} pointe vers ${IP_WWW:-rien} et non $IP_APEX :"
              echo "  certificat emis pour ${{ env.WEB_HOST }} seulement (corriger le CNAME www chez Amen)"
            fi
            echo "▸ Certificat demande pour : $CERT_HOSTS"

            demarrer() {
              docker rm -f ${{ env.APP_CONTAINER }} 2>/dev/null || true
              docker run -d \
                --name ${{ env.APP_CONTAINER }} \
                --network proxy-tier \
                --restart unless-stopped \
                --user 1000:1000 \
                -e VIRTUAL_HOST='${{ env.WEB_HOST }},www.${{ env.WEB_HOST }}' \
                -e VIRTUAL_PORT=3000 \
                -e LETSENCRYPT_HOST="$CERT_HOSTS" \
                -e LETSENCRYPT_EMAIL='${{ secrets.LETSENCRYPT_EMAIL }}' \
                -e NODE_ENV=production \
                -e PORT=3000 \
                -e TRUST_PROXY=true \
                -e APP_URL='https://${{ env.WEB_HOST }}' \
                -e MONGODB_URI='${{ secrets.MONGODB_URI }}' \
                -e MONGODB_DB='${{ vars.MONGODB_DB || secrets.MONGODB_DB || 'kronova' }}' \
                -e GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
                -e SIGNUP_CODE='${{ secrets.SIGNUP_CODE }}' \
                -e ALLOWED_EMAIL_DOMAINS='${{ vars.ALLOWED_EMAIL_DOMAINS || secrets.ALLOWED_EMAIL_DOMAINS }}' \
                -e GOOGLE_CLIENT_ID='${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}' \
                -v ${{ env.DATA_DIR }}:/app/data \
                "$1"
            }

            echo "▸ Mise en service de $NOUVELLE"
            demarrer "$NOUVELLE"

            echo "▸ Attente de la sante"
            saine=0
            # La sonde attend aussi la connexion a MongoDB Atlas.
            for i in $(seq 1 40); do
              etat=$(docker inspect -f '{{.State.Health.Status}}' ${{ env.APP_CONTAINER }} 2>/dev/null || echo absent)
              [ "$etat" = healthy ] && { saine=1; break; }
              [ "$etat" = absent ] && break
              sleep 3
            done

            if [ "$saine" -eq 1 ]; then
              echo "✓ Kronova en service"
              exit 0
            fi

            echo "✗ La nouvelle version ne repond pas"
            docker logs --tail 80 ${{ env.APP_CONTAINER }} 2>&1 || true
            if [ -n "$PRECEDENTE" ]; then
              echo "▸ Retour a $PRECEDENTE"
              demarrer "$PRECEDENTE"
            else
              echo "  aucune version precedente : le service reste indisponible"
            fi
            exit 1

  # ---------------------------------------------------------------------------
  # Verification depuis l'exterieur : certificat, mandataire et DNS compris
  # ---------------------------------------------------------------------------
  verifier-en-ligne:
    name: Verification en ligne
    runs-on: ubuntu-latest
    needs: deployer
    steps:
      - name: Interroger l'adresse publique
        run: |
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 https://${{ env.WEB_HOST }}/api/health; then
              echo ""
              echo "✓ https://${{ env.WEB_HOST }} est en ligne (image ${{ github.sha }})"
              exit 0
            fi
            # Le premier certificat Let's Encrypt peut prendre une a deux minutes
            sleep 10
          done
          echo "✗ Conteneur sain mais https://${{ env.WEB_HOST }} injoignable (DNS ou certificat ?)"
          curl -sI --max-time 10 http://${{ env.WEB_HOST }}/api/health || true
          exit 1

  # ---------------------------------------------------------------------------
  # Menage
  # ---------------------------------------------------------------------------
  nettoyer:
    name: Menage
    runs-on: ubuntu-latest
    needs: [deployer, verifier-en-ligne]
    # Meme si la verification en ligne echoue, mais seulement si un deploiement a eu lieu
    if: always() && needs.deployer.result != 'skipped'
    steps:
      - name: Retirer les images inutilisees
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER || secrets.SERVER_USER || vars.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}
          script: |
            # Uniquement les images sans conteneur et de plus de sept jours : la
            # version precedente reste disponible pour un retour arriere, et les
            # images de MboaPass et d'Akademika en service ne sont pas touchees.
            docker image prune -af --filter 'until=168h' || true
